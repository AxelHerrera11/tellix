version: "3.9"

services:
  tellix-backend:
    build: ./backend
    container_name: tellix-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_URL:      jdbc:sqlserver://host.docker.internal:1433;databaseName=TellixDB;encrypt=true;trustServerCertificate=true
      DB_USER:     ${DB_USER}
      DB_PASS:     ${DB_PASS}
      JWT_SECRET:  ${JWT_SECRET}
      CORS_ORIGINS: http://localhost:80,http://tellix-frontend
    networks:
      - tellix-net

  tellix-frontend:
    build: ./frontend
    container_name: tellix-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - tellix-backend
    networks:
      - tellix-net

networks:
  tellix-net:
    driver: bridge
