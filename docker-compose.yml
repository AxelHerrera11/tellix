services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: tellix-sqlserver
    restart: unless-stopped
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA:       "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - tellix-net

  tellix-backend:
    build: ./backend
    container_name: tellix-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_URL:       jdbc:sqlserver://sqlserver:1433;databaseName=TellixDB;encrypt=true;trustServerCertificate=true
      DB_USER:      ${DB_USER}
      DB_PASS:      ${DB_PASS}
      JWT_SECRET:   ${JWT_SECRET}
      CORS_ORIGINS: http://localhost:80,http://tellix-frontend
    depends_on:
      - sqlserver
    networks:
      - tellix-net

  tellix-frontend:
    build: ./frontend
    container_name: tellix-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - tellix-backend
    networks:
      - tellix-net

networks:
  tellix-net:
    driver: bridge

volumes:
  sqlserver-data:
