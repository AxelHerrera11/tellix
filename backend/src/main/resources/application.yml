spring:
  application:
    name: tellix-backend

  # DataSource gestionado por FailoverDataSource — no usar auto-config de Spring Boot
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

  jdbc:
    template:
      fetch-size: -1

  threads:
    virtual:
      enabled: true   # Virtual Threads — Java 21

server:
  port: 8080
  servlet:
    context-path: /

tellix:
  jwt:
    secret: ${JWT_SECRET:t3ll1x-s3cr3t-k3y-d3b3-t3n3r-m1n1m0-256-b1ts-p4r4-HM4C}
    expiration-ms: 28800000      # 8 horas
    refresh-expiration-ms: 86400000  # 24 horas

  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:4173}

  # ── Alta disponibilidad (HA) ───────────────────────────────────────────────
  ha:
    # PC2 = primario  |  PC3 = secundario (Log Shipping)
    primary-url:   ${DB_PRIMARY_URL:jdbc:sqlserver://100.74.19.127:1433;databaseName=TellixDB;encrypt=true;trustServerCertificate=true}
    secondary-url: ${DB_SECONDARY_URL:jdbc:sqlserver://100.90.132.63:1433;databaseName=TellixDB;encrypt=true;trustServerCertificate=true}
    username:      ${DB_USER:tellix_app}
    password:      ${DB_PASS:C4mbi4M3!Pr0nt0}
    check-interval-ms: 10000   # Health-check cada 10 segundos
    failure-threshold: 3       # 3 fallos consecutivos (≈ 30s) → failover

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
    operations-sorter: alpha

logging:
  level:
    com.tellix: DEBUG
    org.springframework.security: INFO
    com.microsoft.sqlserver: WARN
